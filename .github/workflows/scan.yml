name: TrendSentry Scanner

on:
  schedule:
    - cron: "35 13 * * 1-5"
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Determine scan mode
        id: mode
        run: |
          MINUTE=$(date -u +%M)
          HOUR=$(date -u +%H)
          if [ "$HOUR" = "13" ] && [ "$MINUTE" = "35" ]; then
            echo "mode=morning" >> $GITHUB_OUTPUT
          else
            echo "mode=intraday" >> $GITHUB_OUTPUT
          fi

      - name: Trigger scan
        run: |
          curl -s -X POST "https://trendsentry-claude.base44.app/functions/api/scanTrigger" \
            -H "Authorization: Bearer ${{ secrets.SCAN_TRIGGER_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"mode\":\"${{ steps.mode.outputs.mode }}\"}"
            
# trigger schedule refresh
